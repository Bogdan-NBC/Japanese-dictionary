[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-ocr-dict"
version = "2.0.0"
description = "High-performance Desktop Japanese OCR Pop-up Dictionary for Manga and Light Novels"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Bogdan-NBC" }
]
keywords = [
    "japanese", "ocr", "manga-ocr", "easyocr", "dictionary",
    "yomichan", "10ten", "janome", "nlp", "desktop-overlay"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "easyocr>=1.7.1",
    "manga-ocr>=0.1.11",
    "janome>=0.5.0",
    "requests>=2.31.0",
    "lxml>=5.0.0",
    "Pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
    "numpy>=1.24.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
jp-ocr-dict = "jp_ocr_dict.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/jp_ocr_dict"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-length handled by formatter
    "B008",  # function call in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["jp_ocr_dict"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_decorators = false
